services:
  # ── Backend (FastAPI) ─────────────────────────────────────────────────────
  - type: web
    name: groww-pulse-backend
    runtime: python
    region: singapore
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: groww-pulse-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: JWT_EXPIRE_MINUTES
        value: "10080"
      - key: FRONTEND_ORIGIN
        value: https://groww-pulse-frontend.onrender.com
      - key: PYTHONUNBUFFERED
        value: "1"

  # ── Frontend (Static Site via Nginx) ────────────────────────────────────
  - type: web
    name: groww-pulse-frontend
    runtime: static
    region: singapore
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /api/*
        destination: https://groww-pulse-backend.onrender.com/api/:splat
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: groww-pulse-db
    plan: free
    region: singapore
    databaseName: groww_pulse
    user: groww_user
